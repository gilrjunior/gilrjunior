<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="45%" stop-color="#2f334d"/>
      <stop offset="100%" stop-color="#1a1b27"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="1200" height="120" rx="18" ry="18"/>
    </clipPath>
    <style>
      .tag { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="120" fill="url(#bg)"/>
    <path fill="url(#wave)" d="M0 0 C 250 60, 450 -20, 700 30 S 1000 70, 1200 10 V0 H0 Z">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0 0 C 250 60, 450 -20, 700 30 S 1000 70, 1200 10 V0 H0 Z;
                M0 0 C 200 -10, 500 70, 750 20 S 1050 -10, 1200 40 V0 H0 Z;
                M0 0 C 250 60, 450 -20, 700 30 S 1000 70, 1200 10 V0 H0 Z"/>
    </path>
    <text x="600" y="78" text-anchor="middle" class="tag" fill="#c0caf5" fill-opacity="0.85">FEITO COM ☕ EM UBERABA · MG</text>
  </g>
</svg>
